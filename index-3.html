<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a13">
<meta name="color-scheme" content="dark">
<title>ستالايت</title>
<style>
:root{
  --bg:#060a13;--bg2:#0b1220;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.1);
  --tx:#eaf0fa;--tx2:#9aa8bf;--tx3:#66748c;--acc:var(--p3,#2dd4bf);--acc2:#fbbf24;--red:#fb7185;--grn:#4ade80;
  --nile:#22d3ee;--hot:#fbbf24;--badr:#a78bfa;--net:#4ade80;
  --r:18px;--pad:16px;
  --font:"Cairo","Segoe UI","Noto Sans Arabic","Noto Kufi Arabic",Tahoma,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.45}
body{min-height:100vh;background:
  radial-gradient(1200px 520px at 80% -10%,rgba(45,212,191,.14),transparent 60%),
  radial-gradient(900px 480px at 0% 10%,rgba(167,139,250,.12),transparent 60%),var(--bg);
  padding-bottom:calc(88px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;
  background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 38% 62%,#fff6,transparent),radial-gradient(1.4px 1.4px at 72% 24%,#fff7,transparent),radial-gradient(1px 1px at 88% 70%,#fff5,transparent),radial-gradient(1.2px 1.2px at 55% 88%,#fff6,transparent),radial-gradient(1px 1px at 22% 82%,#fff5,transparent);}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 var(--pad)}
.rp{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;pointer-events:none;transform:scale(0);animation:ripA .55s ease-out forwards}
@keyframes ripA{to{transform:scale(1);opacity:0}}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- الهيدر ---------- */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(6,10,19,.92),rgba(6,10,19,.7));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:10px;height:62px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .mk{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#0f766e,#2dd4bf 60%,#a7f3d0);display:grid;place-items:center;box-shadow:0 6px 20px rgba(45,212,191,.35)}
.logo .mk svg{width:24px;height:24px;stroke:#042f2e;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.logo b{font-size:20px;letter-spacing:.2px;display:block;line-height:1.1}
.logo small{display:block;color:var(--tx2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--tx)}
.ib:active{background:var(--card2)}
.ib.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- الشاشة ---------- */
.layout{display:grid;gap:16px;margin-top:14px;grid-template-columns:minmax(0,1fr)}
.stagecol,.listcol{min-width:0}
@media(min-width:960px){.layout{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}.stagecol{position:sticky;top:76px}}
.stage{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.stage video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain;transition:filter .2s}
.stage.audioonly video{opacity:0}
.poster{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:18px 18px 56px;
  background:radial-gradient(600px 300px at 50% 120%,rgba(45,212,191,.22),transparent 70%),linear-gradient(160deg,#0b1424,#05080f)}
.poster .big{font-size:20px;font-weight:800}
.poster p{margin:6px 0 0;color:var(--tx2);font-size:13px}
.dish{width:74px;height:74px;margin:0 auto 10px;opacity:.9}
.scan{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .25s}
.stage.tuning .scan{opacity:1}
.scan::after{content:"";position:absolute;top:0;bottom:0;width:36%;background:linear-gradient(90deg,transparent,rgba(45,212,191,.28),transparent);animation:sweep 1s linear infinite}
@keyframes sweep{from{left:-40%}to{left:110%}}
.tunebox{position:absolute;inset-inline:0;top:0;padding:12px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);transition:opacity .3s}
.chipx{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14)}
.chipx i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--acc))}
.chipx.live{background:rgba(251,113,133,.18);color:#fecdd3;border-color:rgba(251,113,133,.4)}
.chipx.live i{background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.osdnum{position:absolute;top:12px;inset-inline-start:14px;font-size:44px;font-weight:900;letter-spacing:2px;text-shadow:0 4px 18px #000;color:var(--acc2);display:none;font-variant-numeric:tabular-nums}
.osdnum.on{display:block}
.ctl{position:absolute;inset-inline:0;bottom:0;padding:34px 10px 8px;background:linear-gradient(0deg,rgba(0,0,0,.82),transparent);display:flex;align-items:center;gap:4px;transition:opacity .3s}
.stage.idle .ctl,.stage.idle .tunebox{opacity:0;pointer-events:none}
.cb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.cb:active{background:rgba(255,255,255,.18)}
.cb.on{color:var(--acc)}
.vol{width:84px;accent-color:var(--acc)}
.msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;background:rgba(5,8,15,.82);backdrop-filter:blur(4px)}
.msg.on{display:grid}
.msg{padding:12px 14px 58px;z-index:9}.msg>div{display:flex;flex-direction:column;align-items:center;max-width:100%}.msg .btn{padding:8px 16px;font-size:13px}.msg #msgH{margin:6px 0 0!important}.msg b{display:block;font-size:16px;margin-bottom:4px}
.msg p{margin:0 0 10px;color:var(--tx2);font-size:12.5px;line-height:1.6;max-height:5.2em;overflow:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700}
.btn.p{background:linear-gradient(135deg,var(--p,#0f766e),var(--p2,#115e59));color:#fff;border:0}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:11px}
.info{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.no{min-width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:21px;font-weight:900;background:linear-gradient(135deg,rgba(251,191,36,.2),rgba(251,191,36,.06));color:var(--acc2);border:1px solid rgba(251,191,36,.35);font-variant-numeric:tabular-nums}
.info .nm{min-width:0;flex:1}
.info .nm b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .nm span{display:block;color:var(--tx2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:flex;align-items:flex-end;gap:3px;height:22px}
.meter i{width:5px;border-radius:2px;background:var(--line);transition:background .3s}
.meter i:nth-child(1){height:6px}.meter i:nth-child(2){height:11px}.meter i:nth-child(3){height:16px}.meter i:nth-child(4){height:22px}
.meter.l1 i:nth-child(-n+1),.meter.l2 i:nth-child(-n+2),.meter.l3 i:nth-child(-n+3),.meter.l4 i:nth-child(-n+4){background:var(--grn)}
.meter.l1 i:nth-child(-n+1){background:var(--red)}.meter.l2 i:nth-child(-n+2){background:var(--acc2)}
.quick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.quick .btn{flex:1;min-width:92px;padding:9px 10px;font-size:13.5px}

/* ---------- المدار ---------- */
.orbit{margin-top:0;padding:12px 12px 10px;border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);position:relative;overflow:hidden}
.orbit h3{margin:0 4px 2px;font-size:13px;color:var(--tx2);font-weight:700;display:flex;justify-content:space-between}
.arc{direction:ltr;width:100%;height:auto;display:block}
.arc .belt{fill:none;stroke:rgba(255,255,255,.14);stroke-width:2;stroke-dasharray:3 6}
.arc .node{cursor:pointer}
.arc .node circle.dot{fill:var(--c);opacity:.9;transition:r .2s}
.arc .node.on circle.dot{r:9}
.arc .node circle.ring{fill:none;stroke:var(--c);opacity:0}
.arc .node.on circle.ring{opacity:.7;animation:ring 1.8s ease-out infinite}
@keyframes ring{from{r:8;opacity:.8}to{r:24;opacity:0}}
.arc text{fill:var(--tx2);font-size:11px;font-family:var(--font);text-anchor:middle}
.arc .node.on text{fill:#fff;font-weight:700}
.arc .beam{stroke:var(--acc);stroke-width:1.6;stroke-dasharray:4 5;opacity:.7;transition:all .5s cubic-bezier(.3,.8,.3,1)}
.arc .dishg{transition:transform .5s cubic-bezier(.3,.8,.3,1)}
.satrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 2px}
.satrow::-webkit-scrollbar{display:none}
.sat{flex:none;min-width:98px;padding:9px 12px;border-radius:15px;background:var(--card);border:1px solid var(--line);text-align:start}
.sat b{display:block;font-size:14px;white-space:nowrap}
.sat small{display:flex;gap:6px;color:var(--tx2);font-size:11.5px;margin-top:1px;white-space:nowrap}
.sat.on{background:color-mix(in srgb,var(--c) 18%,transparent);border-color:color-mix(in srgb,var(--c) 65%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),0 8px 24px color-mix(in srgb,var(--c) 18%,transparent)}
.sat .d{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-inline-end:5px}

/* ---------- التصفح ---------- */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:3px;gap:3px;margin-top:14px}
.seg button{flex:1;padding:9px 6px;border-radius:12px;font-weight:700;color:var(--tx2);font-size:14px}
.seg button.on{background:linear-gradient(135deg,var(--p,#0f766e),var(--p2,#115e59));color:#fff}
.search{display:flex;align-items:center;gap:8px;margin-top:12px;padding:0 12px;height:46px;border-radius:15px;background:var(--card);border:1px solid var(--line)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0;height:100%}
.search input::placeholder{color:var(--tx3)}
.search .x{display:none;width:26px;height:26px;border-radius:50%;background:var(--card2);place-items:center;color:var(--tx2)}
.search.has .x{display:grid}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 1px 4px;margin-inline:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--tx2);font-weight:700;font-size:13.5px;white-space:nowrap}
.chip em{font-style:normal;font-size:11.5px;opacity:.75;font-weight:600}
.chip.on{background:color-mix(in srgb,var(--acc) 16%,transparent);border-color:color-mix(in srgb,var(--acc) 60%,transparent);color:color-mix(in srgb,var(--acc) 55%,#fff)}
.chip.lang.on{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.55);color:#fde68a}
.listhd{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 8px;color:var(--tx2);font-size:13px}
.vt{display:flex;gap:4px}
.vt button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--tx3)}
.vt button.on{background:var(--card2);color:var(--tx)}
.list{display:grid;gap:8px}
.list.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.row{content-visibility:auto;contain-intrinsic-size:70px;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:start;width:100%}
.row:active{background:var(--card2)}
.row.cur{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 16%,transparent),rgba(45,212,191,.05));border-color:rgba(45,212,191,.55)}
.row.nos{opacity:.62}
.row.dead{opacity:.45}
.lg{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:900;font-size:17px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 62% 42%),hsl(calc(var(--h) + 40) 68% 32%));text-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;position:relative}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
.rn{flex:1;min-width:0}
.rn b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn span{display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:12px;white-space:nowrap;overflow:hidden;margin-top:2px}
.num{font-size:12px;font-weight:800;color:var(--acc2);min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.tag{padding:1px 7px;border-radius:7px;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.1);color:var(--tx2)}
.tag.hd{background:rgba(251,191,36,.18);color:#fde68a}
.tag.on{background:rgba(74,222,128,.16);color:#86efac}
.tag.off{background:rgba(255,255,255,.07);color:var(--tx3)}
.fv{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--tx3);flex:none}
.fv.on{color:var(--acc2)}
.fv.on svg{fill:var(--acc2)}
.list.grid .row{flex-direction:column;align-items:flex-start;gap:8px;padding:12px}
.list.grid .lg{width:100%;height:62px}
.empty{padding:34px 10px;text-align:center;color:var(--tx2)}
.foot{margin:22px 0 0;color:var(--tx3);font-size:12px;text-align:center;line-height:1.7}

/* ---------- الإذاعة ---------- */
.rbar{position:fixed;inset-inline:0;bottom:0;z-index:35;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));background:rgba(8,13,24,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:none}
.rbar.on{display:block}
.rbar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.rbar .lg{width:42px;height:42px;border-radius:12px}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}
.eq i{width:3px;background:var(--acc);border-radius:2px;height:4px}
.playing .eq i{animation:eq 0.9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s!important}.eq i:nth-child(3){animation-delay:.3s!important}.eq i:nth-child(4){animation-delay:.45s!important}
@keyframes eq{50%{height:16px}}

/* ---------- الشيت (مقبض + X يمين + تأثير دائري) ---------- */
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .22s}
.ov.on{background:rgba(0,0,0,.55)}
.sh{width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;background:#0e1626;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:0 -14px 50px rgba(0,0,0,.6);transform:translateY(100%);transition:transform .27s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom)}
.ov.on .sh{transform:none}
.sh .hd{flex:none;padding:8px 10px 4px;touch-action:none}
.sh .grab{width:42px;height:5px;border-radius:3px;background:var(--tx3);margin:0 auto 6px;opacity:.7}
.sh .bar{display:flex;align-items:center;gap:8px}
.sh .bar b{flex:1;font-size:17px;padding:0 4px}
.sh .xx{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--tx)}
.sh .bd{overflow:auto;padding:6px 14px 18px;-webkit-overflow-scrolling:touch}
.sec{margin:14px 2px 8px;color:var(--tx2);font-size:12.5px;font-weight:800;letter-spacing:.3px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 15px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--tx2)}
.opt.on{background:color-mix(in srgb,var(--acc) 16%,transparent);border-color:color-mix(in srgb,var(--acc) 60%,transparent);color:color-mix(in srgb,var(--acc) 55%,#fff)}
.opt[disabled]{opacity:.4}
.fld{display:flex;align-items:center;gap:12px;padding:8px 2px}
.fld label{width:84px;color:var(--tx2);font-size:13.5px}
.fld input[type=range]{flex:1;accent-color:var(--acc)}
.fld output{width:42px;text-align:end;color:var(--tx2);font-size:12.5px;font-variant-numeric:tabular-nums}
.sw{width:50px;height:30px;border-radius:99px;background:var(--card2);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}
.sw.on::after{inset-inline-start:23px}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px}
.line small{display:block;color:var(--tx3);font-size:12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.pad button{height:62px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:800}
.pad button.a{background:linear-gradient(135deg,var(--p,#0f766e),var(--p2,#115e59));color:#fff}
.padno{text-align:center;font-size:44px;font-weight:900;letter-spacing:6px;min-height:62px;color:var(--acc2);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:200;background:#101a2d;border:1px solid var(--line);padding:10px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;font-size:13.5px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fab{position:fixed;z-index:34;inset-inline-start:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#422006;display:grid;place-items:center;box-shadow:0 10px 28px rgba(245,158,11,.4)}
body.rb .fab{bottom:calc(90px + env(safe-area-inset-bottom))}
body.rb{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.hidden{display:none!important}

.pfs .top,.pfs .nav,.pfs .fab{display:none!important}
.pfs .stagecol,.pfs .layout,.pfs main{position:static!important;transform:none!important;z-index:auto!important;contain:none!important;filter:none!important}
.stage.pfs{position:fixed;inset:0;z-index:200;width:100vw;height:100vh;height:100dvh;border-radius:0;aspect-ratio:auto!important;border:0}
.stage.pfs-rot{inset:auto;top:0;left:100vw;width:100vh;width:100dvh;height:100vw;transform-origin:top left;transform:rotate(90deg)}
.stage:fullscreen{border-radius:0;aspect-ratio:auto!important;width:100vw;height:100vh;border:0}
.stage:-webkit-full-screen{border-radius:0;aspect-ratio:auto!important;width:100vw;height:100vh;border:0}
@media (orientation:portrait){.stage.pfs-rot2:fullscreen{position:fixed;top:0;left:100vw;width:100vh;height:100vw;transform-origin:top left;transform:rotate(90deg)}}

/* ---------- ستالايت: هيدر/تنقل ---------- */
:root{--hdr:56px;--nav:64px}
body{padding-top:calc(var(--hdr) + env(safe-area-inset-top));padding-bottom:calc(var(--nav) + 36px + env(safe-area-inset-bottom))}
body.rb{padding-bottom:calc(var(--nav) + 100px + env(safe-area-inset-bottom))}

var ARAB=['eg','sa','ae','kw','qa','bh','om','jo','lb','sy','iq','ye','ps','ly','tn','dz','ma','sd','so','mr'],EXTRA=['uk','fr','de','tr','cn','jp','kr','ir','us','it','es'];
function parseM3U(txt,cc){
  var L=txt.split(/\r?\n/),out=[];
  for(var i=0;i<L.length;i++){var l=L[i];if(l.indexOf('#EXTINF')!==0)continue;
    var name=l.slice(l.lastIndexOf(',')+1).trim(),ref=false,url='',j=i+1;
    for(;j<L.length&&L[j].indexOf('http')!==0;j++){if(L[j].indexOf('http-referrer')>=0)ref=true;if(L[j].indexOf('#EXTINF')===0)break}
    if(j<L.length&&L[j].indexOf('http')===0)url=L[j].trim();
    var q=(name.match(/\((\d{3,4})p\)/)||[])[1],clean=name.replace(/\s*\[[^\]]*\]|\s*\(\d{3,4}p\)/g,'').trim();
    if(url&&!ref&&!/Geo-blocked/i.test(name))out.push({n:clean,u:url,q:q?+q:0,cc:cc})
    i=j}
  return out;
}
var REFRESHING=false;
function refreshData(manual){
  if(REFRESHING)return;REFRESHING=true;$('bRef').classList.add('spin');
  var files=ARAB.concat(EXTRA);
  var jobs=files.map(function(cc){return fetchT('https://raw.githubusercontent.com/iptv-org/iptv/master/streams/'+cc+'.m3u',15000).then(function(r){return r.text()}).then(function(t){return parseM3U(t,cc)}).catch(function(){return null})});
  Promise.all(jobs).then(function(res){
    var ok=res.filter(Boolean).length;if(!ok){if(manual)toast('تعذر الاتصال بمصدر التحديث — تعمل القوائم المضمّنة');return}
    var live=ls('madar_live_v1')||{},urls={},add=[],addKeys={},nu=0,nn=0;
    res.forEach(function(arr,ix){if(!arr)return;var cc=files[ix];arr.forEach(function(e){
      var k=norm(e.n);if(!k)return;var c=BYKEY[k];
      if(c){(urls[k]=urls[k]||[]);if(urls[k].indexOf(e.u)<0&&(c.u||[]).indexOf(e.u)<0&&urls[k].length<2){urls[k].push(e.u);nu++}}
      else if(ARAB.indexOf(cc)>=0&&!addKeys[k]&&!/radio|\bfm\b|persia|bangla|urdu|chinese/i.test(e.n)){addKeys[k]=1;add.push({n:e.n,c:'general',l:'Ara',u:[e.u],q:e.q,s:[['net',null,0]],cc:cc});nn++}
    })});
    ls('madar_live_v1',{t:Date.now(),urls:urls,add:add});rebuild();renderAll();
    toast('تم التحديث — '+nn+' قناة جديدة و'+nu+' رابط بث إضافي');
  }).then(function(){REFRESHING=false;$('bRef').classList.remove('spin')});

}

function harvest(text){
  var out=[],seen={},lines=String(text).split(/\r?\n/),prev='';
  lines.forEach(function(ln){
    var urls=ln.match(/https?:\/\/[^\s"'<>\\)\]]+/g);
    var t=ln.replace(/https?:\/\/[^\s"'<>\\)\]]+/g,'').replace(/#EXTINF:[^,]*,/,'').replace(/[\-–—:|=>\[\]()]+/g,' ').replace(/\s+/g,' ').trim();
    if(!urls){if(t&&t.length<70)prev=t;return}
    urls.forEach(function(u){u=u.replace(/[.,;،]+$/,'');if(seen[u])return;seen[u]=1;out.push({n:(t&&t.length<70?t:prev)||'',u:u})});
    prev='';

}
